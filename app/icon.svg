<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- The Baudfather app icon: two external modems on a stack. Render: see app/build.sh. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1055"/>
      <stop offset="0.55" stop-color="#3d1a78"/>
      <stop offset="1" stop-color="#12062b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#ff9a3c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a5f6e"/>
      <stop offset="1" stop-color="#2f333d"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23262e"/>
      <stop offset="1" stop-color="#0c0d11"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset="0.5" stop-color="#ffc24a"/>
      <stop offset="1" stop-color="#d98a1c"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="led" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
    <!-- one modem: top face (trapezoid), front panel, LED row -->
    <g id="modem">
      <polygon points="96,0 416,0 452,46 60,46" fill="url(#top)"/>
      <polygon points="96,0 416,0 420,5 92,5" fill="#7b8192" opacity="0.6"/>
      <!-- vent slots on the top -->
      <g stroke="#1d2027" stroke-width="3" stroke-linecap="round" opacity="0.8">
        <line x1="300" y1="12" x2="392" y2="12"/>
        <line x1="304" y1="21" x2="402" y2="21"/>
        <line x1="308" y1="30" x2="412" y2="30"/>
      </g>
      <rect x="60" y="46" width="392" height="64" rx="5" fill="url(#front)"/>
      <rect x="60" y="46" width="392" height="3" fill="#6d7383" opacity="0.7"/>
      <!-- badge -->
      <rect x="78" y="62" width="74" height="30" rx="3" fill="#b3121d"/>
      <rect x="84" y="73" width="62" height="4" fill="#fff" opacity="0.9"/>
      <rect x="84" y="81" width="40" height="3" fill="#fff" opacity="0.6"/>
    </g>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect width="512" height="512" rx="96" fill="url(#glow)"/>

  <!-- shadow under the stack -->
  <ellipse cx="256" cy="352" rx="210" ry="20" fill="#000" opacity="0.55" filter="url(#soft)"/>

  <!-- lower modem -->
  <use href="#modem" x="0" y="226"/>
  <g>
    <g filter="url(#led)" opacity="0.9">
      <circle cx="184" cy="303" r="7" fill="#ff2a2a"/><circle cx="268" cy="303" r="7" fill="#ff2a2a"/>
      <circle cx="352" cy="303" r="7" fill="#ff2a2a"/><circle cx="408" cy="303" r="7" fill="#35ff6b"/>
    </g>
    <g>
      <circle cx="184" cy="303" r="5" fill="#ff5a4a"/><circle cx="212" cy="303" r="5" fill="#4a1414"/>
      <circle cx="240" cy="303" r="5" fill="#4a1414"/><circle cx="268" cy="303" r="5" fill="#ff5a4a"/>
      <circle cx="296" cy="303" r="5" fill="#4a1414"/><circle cx="324" cy="303" r="5" fill="#4a1414"/>
      <circle cx="352" cy="303" r="5" fill="#ff5a4a"/><circle cx="380" cy="303" r="5" fill="#4a1414"/>
      <circle cx="408" cy="303" r="5" fill="#7dffa0"/>
    </g>
  </g>

  <!-- upper modem -->
  <ellipse cx="256" cy="262" rx="190" ry="10" fill="#000" opacity="0.5" filter="url(#soft)"/>
  <use href="#modem" x="0" y="140"/>
  <g>
    <g filter="url(#led)" opacity="0.9">
      <circle cx="184" cy="217" r="7" fill="#ff2a2a"/><circle cx="212" cy="217" r="7" fill="#ff2a2a"/>
      <circle cx="296" cy="217" r="7" fill="#ff2a2a"/><circle cx="324" cy="217" r="7" fill="#ff2a2a"/>
      <circle cx="380" cy="217" r="7" fill="#ff2a2a"/><circle cx="408" cy="217" r="7" fill="#35ff6b"/>
    </g>
    <g>
      <circle cx="184" cy="217" r="5" fill="#ff5a4a"/><circle cx="212" cy="217" r="5" fill="#ff5a4a"/>
      <circle cx="240" cy="217" r="5" fill="#4a1414"/><circle cx="268" cy="217" r="5" fill="#4a1414"/>
      <circle cx="296" cy="217" r="5" fill="#ff5a4a"/><circle cx="324" cy="217" r="5" fill="#ff5a4a"/>
      <circle cx="352" cy="217" r="5" fill="#4a1414"/><circle cx="380" cy="217" r="5" fill="#ff5a4a"/>
      <circle cx="408" cy="217" r="5" fill="#7dffa0"/>
    </g>
  </g>

  <!-- carrier wave above the stack -->
  <path d="M96,104 C116,64 136,64 156,104 S196,144 216,104 S256,64 276,104 S306,134 321,104 S346,82 356,104 S376,120 384,104 S398,94 404,104 S414,110 418,104"
        fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round"/>

  <!-- title -->
  <g font-family="DejaVu Sans, Verdana, sans-serif" font-weight="bold" text-anchor="middle">
    <text x="256" y="424" font-size="62" letter-spacing="6" fill="#000" opacity="0.55" transform="translate(0,4)">BAUD</text>
    <text x="256" y="424" font-size="62" letter-spacing="6" fill="url(#gold)">BAUD</text>
    <text x="256" y="472" font-size="44" letter-spacing="9" fill="#000" opacity="0.55" transform="translate(0,3)">FATHER</text>
    <text x="256" y="472" font-size="44" letter-spacing="9" fill="#f4f0ff">FATHER</text>
  </g>
</svg>
